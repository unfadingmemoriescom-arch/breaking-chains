async function open(pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(P.s),iterations:600000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(P.i)},k,b(P.c));
  return new TextDecoder().decode(pt);
}
async function go(pw,remember,silent){

  catch(x){if(silent){try{localStorage.removeItem('bc-pw')}catch(y){}}else e.textContent='That password did not work. Check it and try again.'}
}
