const b=s=>Uint8Array.from(atob(s),x=>x.charCodeAt(0));
const nz=s=>s.toLowerCase().replace(/\s+/g,'');
async function open(pw){
  pw=nz(pw);
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(P.s),iterations:600000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(P.i)},k,b(P.c));
  return new TextDecoder().decode(pt);
}
async function go(pw,remember,silent){
  const e=document.getElementById('e');if(!silent)e.textContent='Opening…';
  try{const h=await open(pw);if(remember){try{localStorage.setItem('bc-pw',pw)}catch(x){}}
    document.open();document.write(h);document.close()}
  catch(x){if(silent){try{localStorage.removeItem('bc-pw')}catch(y){}}else e.textContent='That password did not work. Check it and try again.'}
}
document.getElementById('f').addEventListener('submit',ev=>{ev.preventDefault();go(document.getElementById('p').value.trim(),document.getElementById('r').checked,false)});
try{const s=localStorage.getItem('bc-pw');if(s)go(s,true,true)}catch(x){}
